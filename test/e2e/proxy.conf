# The reverse proxy of the end-to-end tests and the local preview
# (compose.yaml), which stands for the one of the Sentinel host
# (docs/architecture.md, Same Origin; Cross-Origin Requests): /api and every
# path under it go to Sentinel's API, matched by whole path segment, and every
# other path, /apidocs and /auth/callback included, goes to the UI's image.
# Both receive the request path unchanged, with the Host, Origin, and
# Sec-Fetch-Site headers that the browser sent, and the responses keep the
# headers that they set. nginx's default access log omits the Cookie header.
# scripts/dev-env.sh test checks the same routing for the development proxy.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    # Without a URI in proxy_pass, nginx forwards the request URI unchanged;
    # Origin and Sec-Fetch-Site pass as the browser sent them.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";

    location = /api {
        proxy_pass http://sentinel:8000;
    }

    location /api/ {
        proxy_pass http://sentinel:8000;
    }

    location / {
        proxy_pass http://ui:8080;
    }
}
