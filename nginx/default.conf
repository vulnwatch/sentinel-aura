# The server of the UI's image (docs/architecture.md, Packaging and Serving;
# Security Headers). It replaces the base image's default server; the base
# image's nginx.conf stays unchanged, with nginx's default access log, which
# does not include the Cookie request header (docs/architecture.md, Same
# Origin). scripts/image.sh tests what this file configures.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    # The security headers of every response, the 404 responses included.
    # The locations below merge their own headers with these.
    #
    # The style-src hash is the SHA-256 of the one stylesheet that React Aria
    # inserts at run time, from its usePress hook (react-aria 3.53.1), without
    # a trailing newline:
    #
    #   @layer {
    #     [data-react-aria-pressable] {
    #       touch-action: pan-x pan-y pinch-zoom;
    #     }
    #   }
    #
    # Permissions-Policy disables every feature that Chromium 156 recognizes,
    # except aria-notify, through which an accessibility library can make
    # assistive technologies announce changes.
    add_header_inherit merge;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'sha256-38RhXrc7EdReTKsOm23ZPOCUgniTUUcjky8QOOrQx6o='; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), captured-surface-control=(), ch-device-memory=(), ch-downlink=(), ch-dpr=(), ch-ect=(), ch-prefers-color-scheme=(), ch-prefers-reduced-motion=(), ch-prefers-reduced-transparency=(), ch-rtt=(), ch-save-data=(), ch-ua=(), ch-ua-arch=(), ch-ua-bitness=(), ch-ua-form-factors=(), ch-ua-full-version=(), ch-ua-full-version-list=(), ch-ua-high-entropy-values=(), ch-ua-mobile=(), ch-ua-model=(), ch-ua-platform=(), ch-ua-platform-version=(), ch-ua-wow64=(), ch-viewport-height=(), ch-viewport-width=(), ch-width=(), clipboard-read=(), clipboard-write=(), compute-pressure=(), cross-origin-isolated=(), deferred-fetch=(), deferred-fetch-minimal=(), digital-credentials-create=(), digital-credentials-get=(), display-capture=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), interest-cohort=(), keyboard-map=(), language-detector=(), language-model=(), local-fonts=(), local-network=(), local-network-access=(), loopback-network=(), magnetometer=(), media-playback-while-not-visible=(), microphone=(), midi=(), on-device-speech-recognition=(), otp-credentials=(), payment=(), picture-in-picture=(), private-state-token-issuance=(), private-state-token-redemption=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), summarizer=(), sync-xhr=(), translator=(), unload=(), usb=(), window-management=(), xr-spatial-tracking=()" always;

    # Every path outside the asset directory that is not a file of the build
    # gets the entry document, so that the application resolves the path:
    # /auth/callback, /health, and /ready included. try_files never serves a
    # directory here, so no request is redirected to add a trailing slash.
    location / {
        try_files $uri /index.html;
    }

    # The entry document is revalidated on every load, so that a new release
    # takes effect at once.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The content-hashed files of the build: a file's name changes with its
    # content, so a file never changes and is cached for a year. A missing
    # file, or the directory itself, is a 404, never the entry document.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
