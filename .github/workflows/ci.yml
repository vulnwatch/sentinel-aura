name: CI

# Required quality gates. See docs/deployment.md (CI Pipeline) for this
# workflow's place in the pipeline and for the required status checks.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=koalaman/shellcheck
      SHELLCHECK_VERSION: "0.11.0"
      # renovate: datasource=github-releases depName=mvdan/sh
      SHFMT_VERSION: "3.14.1"
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shell tooling
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/shell-tools"
          mkdir -p "${tools_dir}"

          # Install shellcheck (tar.xz; binary at shellcheck-v<version>/shellcheck)
          curl -fsSL -o "${tools_dir}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf "${tools_dir}/shellcheck.tar.xz" -C "${tools_dir}"
          mv "${tools_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${tools_dir}/shellcheck"

          # Install shfmt (single static binary)
          curl -fsSL -o "${tools_dir}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"

          # Install actionlint (tar.gz containing the actionlint binary)
          curl -fsSL -o "${tools_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "${tools_dir}/actionlint.tar.gz" -C "${tools_dir}" actionlint

          chmod +x "${tools_dir}/shellcheck" "${tools_dir}/shfmt" "${tools_dir}/actionlint"
          echo "${tools_dir}" >>"${GITHUB_PATH}"
      - name: Verify pinned tool versions
        run: |
          set -euo pipefail
          shellcheck --version
          shfmt --version
          actionlint --version
      # shellcheck and shfmt on every tracked shell script and hook, and
      # actionlint, which also runs the pinned shellcheck on every run: block,
      # on every workflow (docs/conventions.md, Shell Scripting). The
      # pre-commit hook selects the staged files in the same way.
      - name: Lint shell scripts, hooks, and workflows
        run: scripts/lint-shell.sh

  ui-checks:
    name: UI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits, so that the audit scope can compare a pull request's
          # merge commit with its first parent, the tip of the base branch.
          fetch-depth: 2
      # The pinned OpenAPI document is identical to the release asset of the
      # supported Sentinel version, and its image tag names the pinned digest
      # (docs/architecture.md, Backend Contract).
      - name: Verify the pinned Sentinel contract
        run: scripts/sentinel-contract.sh verify
      # Every Node.js command runs through scripts/tooling.sh, in the tooling
      # image with the runner's Docker Engine (docs/architecture.md,
      # Development Environment).
      - name: Install dependencies
        run: scripts/tooling.sh install
      # The audit blocks only the runs that can change the dependencies; see
      # docs/deployment.md (Workflow Inventory, Dependency audit). A failure
      # to determine the changed files runs it.
      - name: Determine dependency audit scope
        id: audit-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: scripts/dependency-audit-scope.sh
      - name: Audit dependencies
        if: steps.audit-scope.outputs.required == 'true'
        run: scripts/tooling.sh audit
      # The committed API client is the one that the pinned OpenAPI document
      # and orval.config.ts generate (docs/architecture.md, API Client
      # Generation): regenerate it and fail on any difference.
      - name: Generate the API client
        run: scripts/tooling.sh generate
      - name: Verify that the committed API client is current
        run: |
          set -euo pipefail
          changes="$(git status --porcelain --untracked-files=all -- src/api/generated)"
          if [[ -n "${changes}" ]]; then
            printf '%s\n' "${changes}"
            echo "::error::src/api/generated/ is not the client that the pinned OpenAPI document generates; run scripts/tooling.sh generate and commit the result."
            exit 1
          fi
      - name: Type check
        run: scripts/tooling.sh run typecheck
      - name: Lint
        run: scripts/tooling.sh run lint
      - name: Format check
        run: scripts/tooling.sh run format:check
      - name: Unit and component tests
        run: scripts/tooling.sh run test
      # Handed to the Coverage Upload job, so that CODECOV_TOKEN never reaches
      # the job that runs the code of the dependencies. Vitest writes no
      # report when a test fails, so only a successful run has one.
      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-coverage
          path: coverage/unit/clover.xml
          if-no-files-found: error
          retention-days: 7
      # The image that serves the UI in production, built from the
      # production build and tested as it runs (docs/architecture.md,
      # Packaging and Serving; docs/deployment.md, Workflow Inventory, Image
      # test).
      - name: Build the image
        run: scripts/image.sh build
      - name: Test the image
        run: scripts/image.sh test
      - name: Verify that no dependency reached the working tree
        run: |
          set -euo pipefail
          if [[ -n "$(find node_modules -mindepth 1 -print -quit)" ]]; then
            echo "::error::node_modules/ holds files; dependencies must stay in their directory outside the working tree."
            exit 1
          fi

  # The end-to-end tests, against the UI's production image and a Sentinel
  # backend at the supported version, then the test of the development proxy
  # (docs/deployment.md, Workflow Inventory, End-to-end tests).
  end-to-end-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Builds the image, then runs the tests in Chromium and in Firefox, each
      # against its own backend, loaded with Sentinel's example dataset.
      - name: End-to-end tests
        run: scripts/dev-env.sh e2e
      - name: Development proxy test
        run: scripts/dev-env.sh test
      # The report of each browser, with the screenshots that differ and the
      # traces of the failed tests. The traces hold the session cookies of the
      # run's backends, which no longer exist.
      - name: Retain the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
      # The production build that the tests passed, with the supported version
      # and image digest of contract/, for scripts/dev-env.sh preview. A rerun
      # replaces it.
      - name: Retain the production build for a local preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-preview
          path: |
            dist/
            contract/sentinel-version
            contract/sentinel-image-digest
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Uploads the coverage report of a successful UI Checks job. The resulting
  # codecov/patch status is a required check but informational (codecov.yml).
  # On a pull request a failed upload fails this job, which can be re-run
  # alone; on other events it does not fail the run. See docs/deployment.md
  # (Workflow Inventory, Coverage reporting).
  coverage-upload:
    name: Coverage Upload
    needs: ui-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The Codecov CLI reads the repository for the commit metadata and the
      # list of files that fixes the report paths.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-coverage
          path: coverage/unit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/clover.xml
          disable_search: true
          fail_ci_if_error: ${{ github.event_name == 'pull_request' }}
          # renovate: datasource=github-releases depName=codecov/codecov-cli
          version: "v11.3.1"
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
