name: Image Scan

# Weekly, non-blocking scan of the UI's image for known vulnerabilities of its
# operating system packages. A scan finding is data for the tracking issue,
# never a failure; only a scan that does not complete fails the run. See
# docs/deployment.md (Workflow Inventory, Image vulnerability scan).

on:
  schedule:
    # Every Monday at 06:00 UTC, after Renovate's early-Monday updates.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A run that is writing the tracking issue finishes before the next starts.
concurrency:
  group: image-scan
  cancel-in-progress: false

permissions: {}

jobs:
  image-scan:
    name: Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Trivy's official image, pinned by version and digest and updated by
      # Renovate (docs/deployment.md, Dependency Updates).
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: scripts/image.sh build
      - name: Export the image
        run: scripts/image.sh save "${RUNNER_TEMP}/image.tar"
      - name: Pull the pinned Trivy image
        run: docker pull "${TRIVY_IMAGE}"
      # Trivy runs with the runner's user and group IDs, without capabilities,
      # on the archive of the image, read-only; it receives neither the Docker
      # socket nor a token. The npm dependencies are audited separately
      # (Workflow Inventory, Dependency audit), so the scan covers the
      # operating system packages. The complete report reuses the
      # vulnerability database of the first scan.
      - name: Scan for vulnerabilities
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy" "${RUNNER_TEMP}/trivy-cache"
          run_trivy() {
            docker run --rm --pull=never \
              --user="$(id -u):$(id -g)" \
              --cap-drop=ALL \
              --security-opt=no-new-privileges \
              --volume="${RUNNER_TEMP}/image.tar:/scan/image.tar:ro" \
              --volume="${RUNNER_TEMP}/trivy-cache:/scan/cache" \
              --volume="${RUNNER_TEMP}/trivy:/scan/reports" \
              "${TRIVY_IMAGE}" image \
              --input=/scan/image.tar \
              --cache-dir=/scan/cache \
              --scanners=vuln \
              --pkg-types=os \
              --exit-code=0 \
              --disable-telemetry \
              --skip-version-check \
              "$@"
          }
          run_trivy --ignore-unfixed --severity=HIGH,CRITICAL \
            --format=json --output=/scan/reports/trivy-fixable.json
          run_trivy --skip-db-update \
            --format=table --output=/scan/reports/trivy-full.txt
      - name: Retain the complete report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-full
          path: ${{ runner.temp }}/trivy/trivy-full.txt
          if-no-files-found: error
          retention-days: 90
      # Handed to the Scan Tracking Issue job, so that the write access to
      # issues never reaches the job that runs the scanner.
      - name: Retain the report of fixable vulnerabilities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fixable
          path: ${{ runner.temp }}/trivy/trivy-fixable.json
          if-no-files-found: error
          retention-days: 1

  # The issue tracks the image of master: a manual run on another branch
  # scans that branch and keeps its reports, but leaves the issue alone.
  tracking-issue:
    name: Scan Tracking Issue
    needs: image-scan
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-fixable
          path: ${{ runner.temp }}/trivy
      - name: Open, update, or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/image-scan-issue.sh "${RUNNER_TEMP}/trivy/trivy-fixable.json"
