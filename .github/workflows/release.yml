name: Release

# Publishes the release of a version tag that release-please created with
# its draft GitHub Release: the image, its SBOM, its signed attestations, and
# the release itself, published last. See docs/deployment.md (Release
# Process).

on:
  push:
    tags: ["v*"]

# An interrupted publication leaves an indeterminate state, so a run is never
# cancelled (docs/deployment.md, Workflow Conventions).
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Builds and checks the image of the tagged commit, labeled as the release,
  # as UI Checks does, and its SBOM. The job runs the code of the dependencies
  # in the tooling containers, so it only reads the repository.
  build:
    name: Build Release Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: scripts/image.sh build "${GITHUB_REF_NAME#v}"
      - name: Test the image
        run: scripts/image.sh test
      - name: Generate and check the SBOM
        run: scripts/image.sh sbom "${RUNNER_TEMP}/release/sbom.cdx.json"
      - name: Export the image
        run: scripts/image.sh save "${RUNNER_TEMP}/release/image.tar"
      # Handed to the Publish Release job, so that the write permissions never
      # reach the job that runs the code of the dependencies.
      - name: Retain the image and its SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/image.tar
            ${{ runner.temp }}/release/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Publishes what the Build Release Image job retained, and runs no code of
  # the dependencies.
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the first push: a published release is final, and only the
      # draft release of release-please's tag publishes an image.
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh check
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Load the image
        run: scripts/image.sh load "${RUNNER_TEMP}/release/image.tar"
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
      - name: Push the image
        id: push
        run: |
          set -euo pipefail
          reference="$(scripts/image.sh push "${GITHUB_REF_NAME#v}")"
          echo "name=${reference%@*}" >>"${GITHUB_OUTPUT}"
          echo "digest=${reference#*@}" >>"${GITHUB_OUTPUT}"
      # Both attestations name the image by its digest. Each is stored in
      # GitHub's attestations API and in the registry, beside the image, and
      # its bundle becomes a release asset; no storage record is created.
      - name: Attest the SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/release/sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest the build provenance
        id: attest-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # The last step: the assets and the notes, then the publication.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
          SBOM_BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: >-
          scripts/release.sh publish "${IMAGE}" "${RUNNER_TEMP}/release/sbom.cdx.json"
          "${SBOM_BUNDLE}" "${PROVENANCE_BUNDLE}"
