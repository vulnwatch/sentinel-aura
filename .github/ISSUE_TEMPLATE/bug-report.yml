name: Bug Report
description: Report a bug or unexpected behavior of the web interface.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Thank you for reporting a bug. Please fill in the details below
        to help us reproduce and fix the issue. Report a bug of the Sentinel
        backend or of its API in the
        [Sentinel issue tracker](https://github.com/vulnwatch/sentinel/issues)
        instead, and a vulnerability as described in
        [SECURITY.md](https://github.com/vulnwatch/sentinel-aura/security/policy).
        Use only fictional data in descriptions, logs, and screenshots.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |-
        1. Open the page ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sentinel Aura version
      description: The version or commit of Sentinel Aura where the bug occurs.
    validations:
      required: true

  - type: input
    id: sentinel-version
    attributes:
      label: Sentinel version
      description: >-
        The version of the Sentinel backend that the interface was connected
        to, or "unknown".
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: The browser and its version.
      placeholder: "Firefox 140"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: >-
        Browser console output, failed requests, or screenshots, with every
        personal identifier removed. Logs are formatted as code
        automatically.
      render: text
    validations:
      required: false
